http:
  routers:
    all:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      middlewares:
        - force
        - rate
        - flight
      service: backend
    health:
      rule: "Path(`/ping`)"
      entryPoints:
        - health
      middlewares:
        - config-generation
      service: ping@internal
  middlewares:
    force:
      headers:
        customRequestHeaders:
          X-BRC-Limit-Key: global-v1
    rate:
      rateLimit:
        average: @@BRC_RATE_AVERAGE@@
        period: @@BRC_RATE_PERIOD@@
        burst: @@BRC_RATE_BURST@@
        sourceCriterion:
          requestHeaderName: X-BRC-Limit-Key
    flight:
      inFlightReq:
        amount: @@BRC_CONCURRENT@@
        sourceCriterion:
          requestHeaderName: X-BRC-Limit-Key
    config-generation:
      headers:
        customResponseHeaders:
          X-BRC-Config-Generation: @@BRC_CONFIG_GENERATION@@
  services:
    backend:
      loadBalancer:
        servers:
          - url: @@BRC_RELAY_URL@@
