name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path native/brc-process/Cargo.toml
      - if: runner.os == 'Windows'
        run: pnpm test:unit
      - if: runner.os != 'Windows'
        run: node --test tests/brc-cross-platform.test.mjs tests/brc-platform.test.mjs tests/brc-agent-shell-coordinator.test.mjs
      - if: runner.os == 'Windows'
        run: pnpm test:e2e
